# Lints and tests. Kept separate from CI.yml, which is generated by
# `maturin generate-ci github` and would be overwritten on regeneration.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Clippy
        run: cargo clippy
      - name: Rust tests
        run: cargo test
      - name: Python tests
        run: uv run --locked pytest
